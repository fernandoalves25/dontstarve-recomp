<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Starve — Native ARM64 Recompilation (R36S)</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e;
    --green:#3fb950; --amber:#d29922; --blue:#58a6ff; --grid:#1f6f34; --pruned:#484f58;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;max-width:760px}
  .lang{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex-shrink:0}
  .lang button{background:var(--panel);color:var(--muted);border:0;padding:6px 12px;font:600 12px inherit;cursor:pointer}
  .lang button.on{background:#21262d;color:var(--fg)}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
  .badge{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 12px;display:flex;gap:8px;align-items:center}
  .badge b{font-size:16px} .badge .k{color:var(--muted);font-size:12px}
  .pill{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:rgba(63,185,80,.15);color:var(--green)}
  .pill.work{background:rgba(210,153,34,.15);color:var(--amber)}
  .pill.todo{background:rgba(139,148,158,.12);color:var(--muted)}
  h2{font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);
     border-bottom:1px solid var(--border);padding-bottom:8px;margin:34px 0 16px}
  .tmwrap{display:flex;gap:10px;flex-wrap:wrap}
  .mod{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;flex:1 1 220px;min-width:0}
  .mod h3{margin:0 0 2px;font-size:14px;word-break:break-all} .mod .c{color:var(--muted);font-size:12px;margin-bottom:8px}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,10px);gap:2px}
  .cell{width:10px;height:10px;border-radius:2px;background:#2d333b}
  .cell.r{background:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:12px;margin-top:10px}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .mile{display:flex;flex-direction:column;gap:6px}
  .step{display:flex;gap:12px;background:var(--panel);border:1px solid var(--border);border-left-width:3px;border-radius:6px;padding:10px 12px}
  .step.ok{border-left-color:var(--green)} .step.work{border-left-color:var(--amber)} .step.todo{opacity:.7}
  .step .m{font-weight:700;min-width:34px;color:var(--muted)}
  .step .t{flex:1;min-width:0} .step .t b{display:block} .step .t span{color:var(--muted);font-size:13px}
  .note{background:var(--panel);border:1px solid rgba(210,153,34,.4);border-radius:8px;padding:16px}
  code{background:#010409;border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:12.5px;word-break:break-word}
  .foot{color:var(--muted);font-size:12.5px;margin-top:40px;border-top:1px solid var(--border);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="lang"><button data-l="en">EN</button><button data-l="pt">PT</button></div>
  </div>

  <div class="badges">
    <div class="badge"><span class="k" data-i="bRan"></span><b id="b-ran" style="color:#ff7b72"></b></div>
    <div class="badge"><span class="k" data-i="bFns"></span><b id="b-fns"></b></div>
    <div class="badge"><span class="k" data-i="bFail"></span><b style="color:var(--green)">0</b></div>
    <div class="badge"><span class="k" data-i="bImp"></span><b>955 / 955</b></div>
    <div class="badge"><span class="k" data-i="bPhase"></span><span class="pill work" data-i="phase"></span></div>
  </div>

  <h2 data-i="hLift"></h2>
  <div class="tmwrap" id="tm"></div>
  <div class="legend">
    <span><span class="sw" style="background:var(--green)"></span><span data-i="lgLift"></span></span>
    <span><span class="sw" style="background:#2d333b;outline:1px solid var(--border)"></span><span data-i="lgPrune"></span></span>
    <span data-i="lgCell"></span>
  </div>

  <h2 data-i="hMile"></h2>
  <div class="mile" id="mile"></div>

  <h2 data-i="hHelp"></h2>
  <div class="note" data-i="help" data-html></div>

  <div class="foot" data-i="legal" data-html></div>
</div>

<script>
const T = {
 en:{
  title:"Don't Starve — Native ARM64 recompilation for R36S",
  sub:"Static recompilation of the Windows EXE (x86-32) into native C99 via pcrecomp — no box64, no runtime emulation. Keeps all DLCs, mods, the PT-BR translation and the PC UI.",
  bRan:"Executed at runtime", bFns:"Functions lifted", bFail:"Lift failures", bImp:"Imports resolved", bPhase:"Phase",
  phase:"CRT bring-up",
  hLift:"How much actually runs — by module",
  lgLift:"ran at runtime", lgPrune:"lifted, not run yet", lgCell:"each cell ≈ 16 functions — lifting is the easy part; running is the real progress",
  fns:"fns", pruned:"pruned",
  hMile:"Milestone progress",
  st:{ok:"done",work:"in progress",todo:"to do"},
  miles:[
   ["Input decision + toolchain","x86-32 PE EXE (not ELF); patched pcrecomp"],
   ["Function catalog","17,033 functions (disasm32, 6 discovery rounds)"],
   ["Lift to C99","4.2M lines, 0 failures"],
   ["Compiles + links","x86-64 host; exe + 2 lifted CRT DLLs in one binary"],
   ["Arena host + IAT + DllMain","2 GB arena; 955 imports resolved; CRT DllMain runs"],
   ["CRT initialization","both CRT DllMains + exe CRT startup complete; game main() runs"],
   ["Native main menu","first playable milestone (current: Win32 window + GLES2 context)"],
   ["Stability","close the ICALL loop enough to play"],
   ["Audio (FMOD Ex shim)","FSB5/Vorbis banks"],
   ["PortMaster package + FPS","vs the ~20–22 FPS box64 ceiling"]],
  hHelp:"Where the community can help",
  help:"<b>Current wall: the Win32 surface the game touches before its first frame.</b> The recompiled VC9 CRT now initializes completely (both DllMains, the exe CRT startup) and the game's own <code>main()</code> runs: 630 functions executed, 262 of them in the game exe. It already prints its first line (a failed WMI hardware query, harmless). The next imports are USER32 window management, then the ANGLE <code>libEGL</code>/<code>libGLESv2</code> bridge to native GLES2. Each missing import stops the run with its own name, so the loop is: add the shim, rebuild, rerun.<br><br>How the CRT wall fell: kernel32 <code>DecodePointer</code> shared a cdecl shim and did not pop its argument, which shifted <code>pop esi/pop ebp</code> in the CRT's <code>_decode_pointer</code> (the 0xDEAD0000 <code>this</code>); then lifter support for <code>lock xadd</code> and <code>rep ret</code>; then relocation-based seeds for CRT init tables that recursive descent never reaches. Help wanted: USER32/GDI32 shims over SDL2, the EGL/GLES2 bridge, FMOD Ex.",
  legal:"<b>Legal:</b> this repository contains only original tooling and runtime — <b>no game binaries, assets or code</b>. You need your own legal copy of Don't Starve. Lifted C and all game material stay local (git-ignored). Don't Starve © Klei Entertainment; not affiliated with Klei. · Tooling under the MIT license."
 },
 pt:{
  title:"Don't Starve — Recompilação nativa ARM64 para R36S",
  sub:"Recompilação estática do EXE Windows (x86-32) para C99 nativo via pcrecomp — sem box64, sem emulação em runtime. Preserva todas as DLCs, mods, a tradução PT-BR e a UI de PC.",
  bRan:"Executadas em runtime", bFns:"Funções liftadas", bFail:"Falhas de lift", bImp:"Imports resolvidos", bPhase:"Fase",
  phase:"Bring-up do CRT",
  hLift:"Quanto realmente roda — por módulo",
  lgLift:"rodou em runtime", lgPrune:"liftada, ainda não rodou", lgCell:"cada célula ≈ 16 funções — liftar é a parte fácil; rodar é o progresso real",
  fns:"fns", pruned:"podadas",
  hMile:"Progresso dos marcos",
  st:{ok:"feito",work:"em progresso",todo:"a fazer"},
  miles:[
   ["Decisão de input + toolchain","EXE x86-32 PE (não ELF); pcrecomp patchado"],
   ["Catálogo de funções","17.033 funções (disasm32, 6 rounds de descoberta)"],
   ["Lift para C99","4,2M linhas, 0 falhas"],
   ["Compila + linka","host x86-64; exe + 2 DLLs do CRT liftadas num binário"],
   ["Host arena + IAT + DllMain","arena de 2 GB; 955 imports resolvidos; DllMain do CRT roda"],
   ["Inicialização do CRT","DllMain dos 2 CRTs + startup do CRT do exe completos; main() do jogo roda"],
   ["Menu principal nativo","primeiro marco jogável (atual: janela Win32 + contexto GLES2)"],
   ["Estabilidade","fechar o loop de ICALL o bastante pra jogar"],
   ["Áudio (shim do FMOD Ex)","banks FSB5/Vorbis"],
   ["Pacote PortMaster + FPS","vs o teto de ~20–22 FPS do box64"]],
  hHelp:"Onde a comunidade pode ajudar",
  help:"<b>Parede atual: a superfície Win32 que o jogo usa antes do primeiro frame.</b> O CRT VC9 recompilado agora inicializa por completo (os dois DllMain e o startup do CRT do exe) e o <code>main()</code> do próprio jogo roda: 630 funções executadas, 262 delas no exe do jogo. Ele já imprime a primeira linha (uma consulta WMI de hardware que falha, inofensiva). Os próximos imports são o gerenciamento de janela do USER32 e depois a ponte ANGLE <code>libEGL</code>/<code>libGLESv2</code> para GLES2 nativo. Cada import faltando para a execução com o próprio nome, então o ciclo é: escrever o shim, rebuildar, rodar de novo.<br><br>Como a parede do CRT caiu: o <code>DecodePointer</code> do kernel32 usava um shim cdecl e não desempilhava o argumento, o que deslocava o <code>pop esi/pop ebp</code> no <code>_decode_pointer</code> do CRT (o <code>this</code> = 0xDEAD0000); depois suporte no lifter a <code>lock xadd</code> e <code>rep ret</code>; depois seeds por relocação para as tabelas de init do CRT que a descida recursiva nunca alcança. Procura-se ajuda: shims USER32/GDI32 sobre SDL2, a ponte EGL/GLES2, FMOD Ex.",
  legal:"<b>Legal:</b> este repositório contém apenas ferramentas e runtime originais — <b>nenhum binário, asset ou código do jogo</b>. Você precisa da sua própria cópia legítima de Don't Starve. O C liftado e todo material do jogo ficam locais (fora do git). Don't Starve © Klei Entertainment; sem afiliação com a Klei. · Ferramentas sob licença MIT."
 }
};

// Data comes from status.json (same source as the README images); inline fallback for file://.
let DATA = {per_cell:16, modules:[
  {name:"dontstarve_steam.exe", kind_en:"x86-32 EXE (VC9)", kind_pt:"EXE x86-32 (VC9)", lifted:17033, pruned:0, executed:0},
  {name:"msvcr90.dll", kind_en:"VC9 CRT (lifted)", kind_pt:"CRT VC9 (liftado)", lifted:5069, pruned:231, executed:0},
  {name:"msvcp90.dll", kind_en:"VC9 STL (lifted)", kind_pt:"STL VC9 (liftado)", lifted:3255, pruned:152, executed:0}]};
const MSTATE = ["ok","ok","ok","ok","ok","work","todo","todo","todo","todo"];

function render(lang){
  const t = T[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-i]').forEach(el=>{
    const v = t[el.dataset.i]; if (v === undefined) return;
    if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  const loc = lang === 'pt' ? 'pt-BR' : 'en-US';
  const MODS = DATA.modules, PER = DATA.per_cell;
  const lifted = MODS.reduce((s,m)=>s+m.lifted,0), ran = MODS.reduce((s,m)=>s+(m.executed||0),0);
  document.getElementById('b-fns').textContent = lifted.toLocaleString(loc);
  document.getElementById('b-ran').textContent = ran.toLocaleString(loc) + ' (' + (100*ran/lifted).toLocaleString(loc,{maximumFractionDigits:2}) + '%)';

  const tm = document.getElementById('tm'); tm.innerHTML = '';
  MODS.forEach(m=>{
    const el = document.createElement('div'); el.className = 'mod';
    const cells = m.cells || '0'.repeat(Math.max(1, Math.round((m.lifted+m.pruned)/PER)));
    const ex = m.executed||0, p = (100*ex/m.lifted).toLocaleString(loc,{maximumFractionDigits:1});
    el.innerHTML = `<h3>${m.name}</h3><div class="c">${m['kind_'+lang]} · ${ex.toLocaleString(loc)} / ${m.lifted.toLocaleString(loc)} (${p}%)</div><div class="cells">`
      + [...cells].map(c=>c==='1'?'<span class="cell r"></span>':'<span class="cell"></span>').join('') + `</div>`;
    tm.appendChild(el);
  });

  const mile = document.getElementById('mile'); mile.innerHTML = '';
  t.miles.forEach(([title,desc],i)=>{
    const st = MSTATE[i];
    const el = document.createElement('div'); el.className = 'step ' + st;
    el.innerHTML = `<div class="m">M${i}</div><div class="t"><b>${title} <span class="pill ${st}">${t.st[st]}</span></b><span>${desc}</span></div>`;
    mile.appendChild(el);
  });

  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.l === lang));
  try { localStorage.setItem('ds-lang', lang); } catch(e) {}
}

let start = 'en';
try {
  const saved = localStorage.getItem('ds-lang');
  if (saved === 'en' || saved === 'pt') start = saved;
  else if ((navigator.language||'').toLowerCase().startsWith('pt')) start = 'pt';
} catch(e) {}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.l)));
let cur = start;
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.l;}));
render(start);
fetch('status.json').then(r=>r.json()).then(j=>{DATA=j; render(cur);}).catch(()=>{});
</script>
</body>
</html>
