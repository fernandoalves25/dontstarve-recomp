# Don't Starve (R36S) - opcoes do port. Salve sempre com finais de linha LF.

# native = SDL2 do sistema direto na tela (KMS/DRM), sem X11/Weston. Testado no
#          R36S (clone K36, ArkOS): abre pelo menu, 30 FPS no menu, 25-30 no jogo.
# weston = SDL2 do jogo dentro do Westonpack (perfil dos devs do box64). Use se
#          o native der tela preta no seu firmware.
RENDER_MODE=native

# 1 = no primeiro boot reduz as texturas de animacao e de chao pela metade,
#     sem recompressao (descarta so o maior mipmap). Carregamentos ~4x menos
#     dados. Para desfazer, copie os arquivos originais do jogo de novo.
OPTIMIZE_TEXTURES=1

# 1 = o motor reduz as texturas pela metade de novo ao carregar. Em aparelhos
#     com 1 GB de RAM e necessario: sem isso a memoria acaba ao carregar o mundo
#     (a GPU usava ~450 MB, com isso ~130 MB). 0 = mais nitido, para 2 GB+.
SMALL_TEXTURES=1

# 1 = fecha o EmulationStation enquanto o jogo roda e reabre no fim (~12 s).
#     Libera os 200-400 MB que ele segura parado atras do jogo. Precisa de
#     firmware com systemd (ArkOS, dArkOS). 0 = deixa o EmulationStation aberto.
STOP_ES=1

# 1 = o gl4es descomprime texturas DXT em 16 bits (metade da RAM de video).
TEX_16BIT=1

# 1 = ativa o mod "R36S Performance": 30 FPS (netbook mode), controle ligado,
#     sem bloom, distorcao, vinheta e copa do Hamlet, chuva/neve com 30% das
#     particulas.
PERF_MOD=1

# 1 = flags rapidas do dynarec do box64. Se o jogo fechar sozinho, use 0.
BOX64_FAST=1

# Ajustes extras do box64, separados por espaco (avancado)
BOX64_EXTRA=""

# 1 = ajusta o FMOD (o audio do jogo) antes dele iniciar: mixa mais blocos
#     adiantados, numa taxa menor e com menos sons ao mesmo tempo. Corrige o som
#     picotado quando o jogo fica lento. 0 = FMOD como o jogo configura.
FMOD_TUNE=1
FMOD_BLOCKS=16      # blocos de mixagem adiantados (o jogo usa 4); 16 = ~341 ms
FMOD_RATE=0         # Hz de mixagem; 0 = o do jogo (48000). Menos que isso
                    # distorce os agudos e quase nao ganha FPS
# 1 = sem reverb (o efeito de eco por area): o mixer emulado do FMOD fica
#     sem folga no mundo e o som picota; desligar a reverb alivia o mixer.
FMOD_NOREVERB=1
# interpolacao do mixer: 1 = nenhuma (mais leve), 0 = a do jogo
FMOD_RESAMPLER=1
FMOD_VOICES=24       # sons mixados ao mesmo tempo; 0 = o do jogo (64)

# 1 = esconde a seta do mouse (o R36S nao tem mouse, mas a SDL desenha a seta)
HIDE_CURSOR=1

# Buffer de audio em amostras a 48 kHz (8192 = ~170 ms). Maior = menos som
# picotado, mas os efeitos sonoros saem um pouco mais atrasados. Se ainda picotar,
# tente 16384. 0 = deixa o audio como o sistema configura (o original picota).
AUDIO_BUFFER=16384

# 1 = mostra o FPS no canto superior esquerdo da tela (precisa de PERF_MOD=1)
SHOW_FPS=1

# 1 = grava no log.txt o FPS medio a cada 10 s (diagnostico)
DEBUG_FPS=0

# 1 = CPU, GPU e memoria em "performance" enquanto o jogo roda (o ArkOS deixa a
#     memoria a 328 MHz, o que derruba o FPS); volta ao normal ao sair.
PERF_GOV=1

# 1 = thread principal do jogo sozinha no nucleo 3 (as outras nos nucleos 0-2).
PIN_MAIN=0

# 1 = liga o mod r36s-hud (HUD e textos maiores), se a pasta dontstarve/mods/r36s-hud existir
#     (copie de port/mods/r36s-hud deste repositorio).
HUD_MOD=1
